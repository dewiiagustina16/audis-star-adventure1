<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audi’s Star Adventure</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;font-family:"Comic Sans MS","Chalkboard SE",ui-rounded,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#g{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#bfe6ff}
button{font:inherit;cursor:pointer;border:0}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:none;justify-content:space-between;padding:10px 14px;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:#fff9;border:3px solid #fff;border-radius:30px;padding:6px 18px;font-size:clamp(15px,3.2vw,24px);font-weight:700;color:#e6a100;box-shadow:0 3px 0 #0001}
#rs{background:#ffb3c7;color:#fff;border-radius:30px;padding:6px 18px;font-size:clamp(18px,3.5vw,26px);font-weight:700;box-shadow:0 4px 0 #e68aa4}
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#fff;border-radius:24px;padding:8px 22px;font-size:clamp(18px,3.5vw,26px);color:#ff7a9c;font-weight:700;display:none;box-shadow:0 4px 0 #0002;white-space:nowrap}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#cdeeffcc;text-align:center;padding:10px;overflow:auto}
h1{margin:0;font-size:clamp(34px,8vw,68px);color:#fff;text-shadow:0 4px 0 #ff9ab5,0 8px 0 #0002;line-height:1.05}
h2{margin:0;font-size:clamp(32px,7vw,60px);color:#ff7a9c;text-shadow:0 3px 0 #fff}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{background:#fff;border:5px solid #fff;border-radius:26px;padding:8px 14px 10px;font-size:22px;font-weight:700;color:#7a6a8a;box-shadow:0 5px 0 #0002}
.card.sel{border-color:#ffd23f;background:#fff8d6;transform:scale(1.07)}
.card canvas{display:block;width:110px;height:110px}
.big{background:#7fd97f;color:#fff;font-size:clamp(26px,5vw,40px);font-weight:700;padding:10px 46px;border-radius:40px;box-shadow:0 6px 0 #55b855}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #55b855}
.small{background:#fff9;color:#7a6a8a;border-radius:20px;padding:6px 14px;font-size:15px}
#set{display:none;background:#fff;border-radius:18px;padding:10px 16px;font-size:15px;color:#555;text-align:left;max-width:92vw;max-height:40vh;overflow:auto}
#set label{display:flex;justify-content:space-between;gap:12px;margin:5px 0;align-items:center}
#set p{margin:0 0 6px;font-size:13px}
#pad{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
#pad div{display:flex;gap:14px}
#pad button{pointer-events:auto;width:clamp(74px,18vw,96px);height:clamp(74px,18vw,96px);border-radius:50%;font-size:34px;color:#fff;background:#ff9ab5aa;border:4px solid #fff;touch-action:none}
#pad button.on{background:#ffd23f}
#bj{background:#7fd97faa!important}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s;z-index:50}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#fx span{position:absolute;top:-60px;animation:fall 3.2s linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#hud{padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(14px + env(safe-area-inset-right,0px))}
#pad{padding-left:calc(18px + env(safe-area-inset-left,0px));padding-right:calc(18px + env(safe-area-inset-right,0px))}
@media (orientation:landscape) and (max-height:540px){
 .ov{gap:1.6vh;padding:6px}
 h1{font-size:min(9vh,46px);text-shadow:0 3px 0 #ff9ab5}
 h1 br{display:none}
 #menu>div:not(.row){font-size:4vh!important}
 .row{gap:2.5vh}
 .card{padding:1vh 2vh;font-size:4.4vh;border-width:3px}
 .card canvas{width:21vh;height:21vh}
 .big{font-size:6vh;padding:1vh 6vh;box-shadow:0 4px 0 #55b855}
 h2{font-size:min(8vh,40px)}
 #wst{font-size:4.2vh!important;line-height:1.3!important;padding:1vh 3vh}
 #pad{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
 #pad button{width:clamp(60px,22vh,80px);height:clamp(60px,22vh,80px);font-size:28px}
 .pill{font-size:min(5.2vh,22px)}
 #rs{font-size:min(5vh,20px);padding:4px 14px}
 #toast{top:52px;font-size:min(5vh,20px);padding:4px 16px}
}
</style></head><body>

<div id="hud"><div class="pill">Lv<span id="lv">1</span> · ⭐ <span id="sc">0</span> · <span id="fi">🥕</span> <span id="fc">0</span> · Skor <span id="ts">0</span></div><button id="rs">↻ Ulang</button></div>
<div id="toast"></div><div id="fade"></div><div id="fx"></div>
<div id="pad"><div><button id="bl">◀</button><button id="br">▶</button></div><button id="bj">⤒</button></div>

<div id="menu" class="ov">
  <h1>⭐ Audi’s<br>Star Adventure ⭐</h1>
  <div style="font-size:22px;color:#7a6a8a;font-weight:700">Pilih temanmu!</div>
  <div class="row">
    <button class="card sel" id="c-cat"><canvas id="p-cat" width="220" height="220"></canvas>Kucing</button>
    <button class="card" id="c-rabbit"><canvas id="p-rabbit" width="220" height="220"></canvas>Kelinci</button>
  </div>
  <button class="big" id="play">▶ Main</button>
</div>

<div id="win" class="ov" style="display:none">
  <h2 id="wt"></h2>
  <div id="wst" class="pill" style="font-size:clamp(17px,3.6vw,28px);line-height:1.5;text-align:center;color:#7a6a8a"></div>
  <div class="row"><button class="big" id="next">Next Level ▶</button><button class="big" id="again">Main Lagi</button><button class="big" id="home" style="background:#ffb3c7;box-shadow:0 6px 0 #e68aa4">Menu</button></div>
</div>

function drawChar(c,type,x,y,w,st,t,dir){
 c.save();c.translate(x+w/2,y);c.scale(dir*w/40,w/40);c.lineCap='round';
 const cat=type==='cat',F=cat?'#ffc47d':'#ffffff',D=cat?'#f2a14f':'#ffc6d9',walk=st==='walk',jump=st==='jump';
 const sw=walk?Math.sin(t*.3):0,bob=st==='idle'?Math.sin(t*.07)*1.5:walk?Math.abs(sw)*3:0,eb=-bob+(jump?-3:0),hy=-30+eb;
 if(cat){c.strokeStyle=F;c.lineWidth=7;c.beginPath();c.moveTo(-10,-14);c.quadraticCurveTo(-26,-16+Math.sin(t*.15)*6,-22,-32);c.stroke()}
 else ell(c,-14,-14,6,6,'#fff',D);
 ell(c,-8+sw*6,jump?-9:-4,7,5,D);ell(c,10-sw*6,jump?-9:-4,7,5,D);
 ell(c,-2,-15+eb*.6,13,11,F,D);
 [-8,12].forEach((ex,i)=>{if(cat){c.fillStyle=F;c.strokeStyle=D;c.lineWidth=2;c.beginPath();c.moveTo(ex-7,-38+eb);c.lineTo(ex+(i?2:-2),-54+eb);c.lineTo(ex+7,-38+eb);c.closePath();c.fill();c.stroke();c.fillStyle='#ffb3c1';c.beginPath();c.moveTo(ex-3,-39+eb);c.lineTo(ex+(i?2:-2),-49+eb);c.lineTo(ex+3,-39+eb);c.closePath();c.fill()}
  else{c.save();c.translate(ex-1,-40+eb);c.rotate((jump?-.5:-.12+(i?.25:0))+sw*.15);ell(c,0,-12,5.5,15,F,D);ell(c,0,-12,2.6,10,'#ffb3c1');c.restore()}});
 ell(c,2,hy,16,14,F,D);
 if(cat){c.strokeStyle=D;c.lineWidth=2;[-5,2,9].forEach(a=>{c.beginPath();c.moveTo(a,hy-14);c.lineTo(a,hy-9);c.stroke()})}
 [0,11].forEach(ex=>{ell(c,ex,hy-1,3,3.4,'#4a3535');ell(c,ex+1,hy-2.2,1,1,'#fff')});
 ell(c,-4,hy+5,3.6,2.2,'#ffb3c1');ell(c,15,hy+5,3.6,2.2,'#ffb3c1');ell(c,7,hy+3,2,1.5,'#ff8fa3');
 c.strokeStyle='#4a3535';c.lineWidth=1.5;c.beginPath();c.arc(7,hy+4,3,.2,Math.PI-.2);c.stroke();
 if(cat){c.lineWidth=1;[[-1,-2],[0,1]].forEach(([a,b])=>{c.beginPath();c.moveTo(16,hy+4+a*2);c.lineTo(25,hy+3+a*4);c.stroke();c.beginPath();c.moveTo(-8,hy+4+a*2);c.lineTo(-17,hy+3+a*4);c.stroke()})}
 c.restore()}
function drawPlayer(c,type,x,y,w,h,st,t,dir,hp=0){
 const im=IMG[type];
 if(!im)return drawChar(c,type,x,y+h,w,st,t,dir);
 const sc=w/40,SW=(SPR[type]||60)*sc,SH=SW*im.height/im.width,wk=st==='walk',hop=hp>0?Math.abs(Math.sin(hp*.35))*12*sc:0;
 const bob=wk?Math.abs(Math.sin(t*.3))*3:st==='idle'?Math.sin(t*.07)*1.5:0,sy=st==='jump'?1.1:1+(hp>0?Math.sin(hp*.5)*.06:0),sx=st==='jump'?.93:1;
 c.save();c.translate(x+w/2,y+h-hop-bob);c.scale(dir*(FACE[type]||1),1);c.rotate(wk?Math.sin(t*.3)*.07:hp>0?Math.sin(hp*.5)*.12:0);c.scale(sx,sy);c.drawImage(im,-SW/2,-SH,SW,SH);c.restore()}

/* ===== STATE ===== */
let state='menu',sel='cat',keys={},P,stars,foods,tot={score:0,stars:0,food:0},snap,ls=0,lf=0,cam=0,T=0,inv=0,safe,coy=0,buf=0,tt,lv=0,L,LW,FIN,GROUND,PLATS,OBS,pops=[],cpOn=[],CLC='#fff';
const KD={rock:[40,30],mushroom:[40,36],bigrock:[50,46]};
function press(k,v){keys[k]=v;if(k==='jump'&&v)buf=8}
function toast(t,ms=1600){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',ms)}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hud(){$('sc').textContent=tot.stars;$('fc').textContent=tot.food;$('ts').textContent=tot.score;$('fi').textContent=sel==='cat'?'🍖':'🥕';$('lv').textContent=lv+1}
function loadLevel(i){
 lv=i;L=LEVELS[i];LW=L.LW;FIN=LW-200;GROUND=L.G;PLATS=L.P;CLC=L.rain?'#9aa6b8':'#fff';
 OBS=[...L.R.map(x=>[x,'rock']),...L.M.map(x=>[x,'mushroom']),...L.B.map(x=>[x,'bigrock'])].map(([x,k])=>{const[w,h]=KD[k];return{k,dx:x,x:x+5,y:GY-h+4,w:w-10,h:h-4}});
 stars=L.S.map(s=>({x:s[0],y:s[1],got:0}));foods=L.F.map(s=>({x:s[0],y:s[1],got:0}));cpOn=L.C.map(()=>0);pops=[];
 snap={...tot};ls=0;lf=0;cam=0;inv=0;keys={};
 P={x:60,y:GY-44,w:40,h:44,vx:0,vy:0,on:true,dir:1,happy:0};safe={x:60,y:GY-44};
 hud();if(state==='play')toast(L.name,2600)}
function land(y){P.y=y-P.h;P.vy=0;P.on=true}
function update(){
 P.vx=keys.right?SP:keys.left?-SP:0;if(P.vx)P.dir=P.vx>0?1:-1;
 P.x=Math.max(0,Math.min(LW-P.w,P.x+P.vx));
 if(buf>0)buf--;if(P.on)coy=7;else if(coy>0)coy--;
 if(buf>0&&coy>0){P.vy=-13;coy=0;buf=0;P.on=false}
 const pb=P.y+P.h;P.vy=Math.min(P.vy+.6,14);P.y+=P.vy;P.on=false;
 if(P.vy>=0){const nb=P.y+P.h,cx=P.x+P.w/2;
  if(pb<=GY+1&&nb>=GY&&GROUND.some(g=>cx>g[0]&&cx<g[1]))land(GY);
  else for(const p of PLATS)if(pb<=p[1]+1&&nb>=p[1]&&P.x+P.w>p[0]&&P.x<p[0]+p[2]){land(p[1]);break}}
 if(P.on&&P.y+P.h===GY&&GROUND.some(g=>P.x>g[0]+50&&P.x+P.w<g[1]-50))safe={x:P.x,y:P.y};
 if(P.y>520){P.x=safe.x;P.y=safe.y;P.vy=0;inv=60;toast('Ups! Coba lagi ya! 💪')}
 if(inv>0)inv--;
 else{const hb={x:P.x+6,y:P.y+6,w:P.w-12,h:P.h-6};if(OBS.some(o=>hit(hb,o))){P.x=Math.max(0,P.x-110);P.vy=-8;P.on=false;inv=90;toast('Ups! Coba lagi ya! 💪')}}
 if(P.happy>0)P.happy--;
 const px=P.x+P.w/2,py=P.y+P.h/2;
 for(const s of stars)if(!s.got&&Math.hypot(s.x-px,s.y-py)<30){s.got=1;tot.score+=10;tot.stars++;ls++;pops.push({x:s.x,y:s.y,t:40,s:'+10'});hud()}
 for(const f of foods)if(!f.got&&Math.hypot(f.x-px,f.y-py)<32){f.got=1;tot.score+=5;tot.food++;lf++;P.happy=45;pops.push({x:f.x,y:f.y-10,t:55,s:'+5 ❤'});hud()}
 L.C.forEach((x,i)=>{if(!cpOn[i]&&P.x>=x){cpOn[i]=1;toast('Checkpoint! ✅',1400)}});
 pops.forEach(p=>{p.y-=.8;p.t--});pops=pops.filter(p=>p.t>0);
 cam=Math.max(0,Math.min(LW-800,P.x-300));
 if(P.x+P.w>=FIN)finish()}
function finish(){state='done';keys={};tot.score+=20;hud();const fin=lv===LEVELS.length-1,e=sel==='cat'?'🍖':'🥕';
 $('wt').textContent=fin?'🌟 Amazing! You are a Star Collector! 🌟':'🎉 Yeay! Kamu berhasil! 🎉';
 $('wst').innerHTML=L.name+'<br>⭐ '+ls+' × 10 = '+ls*10+'<br>'+e+' '+lf+' × 5 = '+lf*5+'<br>Bonus selesai +20<br><b>Total skor: '+tot.score+'</b>'+(fin?'<br>⭐ '+tot.stars+' &nbsp; '+e+' '+tot.food:'');
 $('next').style.display=fin?'none':'';$('again').style.display=fin?'':'none';$('win').style.display='flex';burst(fin?70:32)}
function burst(n){const f=$('fx');f.innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=['⭐','🌟','✨','🎉'][i%4];s.style.cssText='left:'+Math.random()*100+'vw;animation-delay:'+Math.random()*3+'s;font-size:'+(20+Math.random()*26)+'px';f.append(s)}}

/* ===== GAMBAR LAYAR ===== */
const FL=['#ff9ac1','#ffd23f','#c8a2ff','#ff9a76','#fff'];
const onG=x=>GROUND.some(g=>x>g[0]+20&&x<g[1]-20);
function rainbow(c,cx,r){c.globalAlpha=.85;['#ff9aa2','#ffc99a','#fff0a0','#b5ead7','#a0d8ff','#d0b8ff'].forEach((col,i)=>{c.beginPath();c.arc(cx,GY,r-i*9,Math.PI,0);c.strokeStyle=col;c.lineWidth=9.5;c.stroke()});c.globalAlpha=1}
function render(){
 const c=ctx,g=c.createLinearGradient(0,0,0,GY);g.addColorStop(0,L.sky[0]);g.addColorStop(1,L.sky[1]);c.fillStyle=g;c.fillRect(0,0,800,450);
 if(L.sun)pic(c,'sun',640,14,110,110);
 c.save();if(L.rain&&IMG.cloud)c.filter='grayscale(1) brightness(.7)';
 for(let i=0;i<10;i++){const x=((i*290-cam*.2+T*.12)%2900+2900)%2900-200;pic(c,'cloud',x,28+(i%3)*36,120,60)}c.restore();
 [[.3,L.hills[0],0,120],[.55,L.hills[1],200,90]].forEach(([f,col,o,ry])=>{for(let i=-1;i<4;i++)ell(c,i*420-(cam*f)%420+o,GY+20,250,ry,col)});
 c.save();c.translate(-Math.round(cam),0);
 (L.rb||[]).forEach(x=>rainbow(c,x,150));
 L.H.forEach(x=>pic(c,'house',x,GY-95,130,95));
 L.T.forEach(x=>pic(c,'tree',x,GY-120,80,120));
 (L.um||[]).forEach(x=>pic(c,'umbrella',x,GY-56,46,56));
 GROUND.forEach((s,i)=>{c.fillStyle=L.soil||'#ecd0a2';c.fillRect(s[0],GY,s[1]-s[0],100);c.fillStyle=L.gr[0];c.fillRect(s[0],GY,s[1]-s[0],14);c.fillStyle=L.gr[1];c.fillRect(s[0],GY+14,s[1]-s[0],4);
  if(GROUND[i+1]){c.fillStyle='#b88e5f';c.fillRect(s[1],GY+30,GROUND[i+1][0]-s[1],100)}});
 (L.pd||[]).forEach((x,i)=>{ell(c,x,GY+5,34,6,'#8ec5ea');const r=(T*.35+i*5)%18;c.strokeStyle='rgba(255,255,255,'+(1-r/18)+')';c.lineWidth=1.5;c.beginPath();c.ellipse(x+(i%3-1)*10,GY+5,r*1.6,r*.3,0,0,7);c.stroke()});
 if(L.fl)for(let i=0,x=40;x<LW;i++,x+=58+(i*37)%24){if(x<cam-20||x>cam+820||!onG(x)||OBS.some(o=>Math.abs(o.dx+20-x)<45))continue;const fy=GY-14-(i%3)*4;c.strokeStyle='#4caf50';c.lineWidth=2;c.beginPath();c.moveTo(x,GY);c.lineTo(x,fy);c.stroke();for(let a=0;a<5;a++)ell(c,x+Math.cos(a*1.257)*4,fy+Math.sin(a*1.257)*4,3.2,3.2,FL[i%5]);ell(c,x,fy,2.4,2.4,'#ffb52e')}
 PLATS.forEach(p=>{c.fillStyle='#ffd6a5';c.fillRect(p[0],p[1],p[2],16);c.fillStyle=L.gr[0];c.fillRect(p[0],p[1],p[2],7)});
 OBS.forEach(o=>{const[w,h]=KD[o.k];pic(c,o.k==='bigrock'?'rock':o.k,o.dx,GY-h,w,h)});
 L.C.forEach((x,i)=>{c.fillStyle='#fff';c.fillRect(x,GY-50,4,50);c.fillStyle=cpOn[i]?'#ffd23f':'#ff9ab5';c.beginPath();c.moveTo(x+4,GY-50);c.lineTo(x+30,GY-41);c.lineTo(x+4,GY-32);c.closePath();c.fill()});
 pic(c,'flag',FIN,GY-130,60,130);
 stars.forEach(s=>{if(!s.got)pic(c,'star',s.x-16,s.y-16+Math.sin(T*.06+s.x)*4,32,32)});
 const fk=sel==='cat'?'meat':'carrot';foods.forEach(f=>{if(!f.got)pic(c,fk,f.x-15,f.y-22+Math.sin(T*.07+f.x)*4,30,44)});
 if(state!=='menu'&&!(inv>0&&Math.floor(inv/6)%2)){const st=!P.on?'jump':P.vx?'walk':'idle';drawPlayer(c,sel,P.x,P.y,P.w,P.h,st,T,P.dir,P.happy)}
 c.font='700 20px "Comic Sans MS",system-ui';c.textAlign='center';c.lineWidth=4;c.strokeStyle='#fff';c.fillStyle='#ff7a9c';
 pops.forEach(p=>{c.globalAlpha=Math.min(1,p.t/20);c.strokeText(p.s,p.x,p.y);c.fillText(p.s,p.x,p.y)});c.globalAlpha=1;
 c.restore();
 if(L.rain){c.fillStyle='rgba(70,85,110,.14)';c.fillRect(0,0,800,450);c.strokeStyle='rgba(190,225,255,.75)';c.lineWidth=1.5;c.beginPath();for(let i=0;i<90;i++){const x=(i*97+T*2.5)%830-15,y=(i*53+T*13)%480-20;c.moveTo(x,y);c.lineTo(x-4,y+12)}c.stroke()}}
function previews(){['cat','rabbit'].forEach(k=>{const c=$('p-'+k).getContext('2d');c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,110,110);drawPlayer(c,k,30,45,50,55,'idle',T,1)})}

/* ===== UI ===== */
function fade(fn){const f=$('fade');f.style.opacity=1;setTimeout(()=>{fn();f.style.opacity=0},480)}
function start(){tot={score:0,stars:0,food:0};$('fx').innerHTML='';$('menu').style.display='none';$('win').style.display='none';$('hud').style.display='flex';state='play';loadLevel(0)}
function home(){state='menu';$('fx').innerHTML='';tot={score:0,stars:0,food:0};loadLevel(0);$('win').style.display='none';$('menu').style.display='flex';$('hud').style.display='none';$('toast').style.display='none'}
$('play').onclick=start;$('again').onclick=start;$('home').onclick=home;
$('next').onclick=()=>{$('win').style.display='none';$('fx').innerHTML='';fade(()=>{state='play';loadLevel(lv+1)})};
$('rs').onclick=()=>{$('rs').blur();tot={...snap};state='play';loadLevel(lv)};
['cat','rabbit'].forEach(k=>$('c-'+k).onclick=()=>{sel=k;['cat','rabbit'].forEach(j=>$('c-'+j).classList.toggle('sel',j===k))});

const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump'};
addEventListener('keydown',e=>{const k=KM[e.code];if(!k)return;e.preventDefault();if(!e.repeat)press(k,1)});
addEventListener('keyup',e=>{const k=KM[e.code];if(!k)return;e.preventDefault();press(k,0)});
addEventListener('blur',()=>keys={});
[['bl','left'],['br','right'],['bj','jump']].forEach(([id,k])=>{const b=$(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}press(k,1);b.classList.add('on')});
 ['pointerup','pointercancel'].forEach(v=>b.addEventListener(v,()=>{press(k,0);b.classList.remove('on')}));
 b.addEventListener('contextmenu',e=>e.preventDefault())});
if('ontouchstart' in window||navigator.maxTouchPoints>0)$('pad').style.display='flex';

let last=0,acc=0;
function loop(ts){requestAnimationFrame(loop);acc+=Math.min(100,ts-last);last=ts;
 while(acc>=16.67){acc-=16.67;T++;if(state==='play')update()}
 render();if(state==='menu')previews()}
loadLevel(0);requestAnimationFrame(loop);
</script></body></html>
